name: Refazer materia por comentario

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: refazer-materia-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  refazer:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/refazer') &&
      contains(
        fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association
      )

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter dados do Pull Request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail

          gh api \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            > pr.json

          HEAD_REF=$(jq -r '.head.ref' pr.json)
          HEAD_REPO=$(jq -r '.head.repo.full_name' pr.json)
          BASE_REF=$(jq -r '.base.ref' pr.json)

          if [ -z "$HEAD_REF" ] || [ "$HEAD_REF" = "null" ]; then
            echo "Nao foi possivel identificar a branch do Pull Request."
            exit 1
          fi

          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "Este fluxo aceita apenas Pull Requests com branch no mesmo repositorio."
            exit 1
          fi

          if [ "$BASE_REF" != "main" ]; then
            echo "O Pull Request precisa ter a branch main como destino."
            exit 1
          fi

          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"

          echo "Pull Request: $PR_NUMBER"
          echo "Branch editorial: $HEAD_REF"
          echo "Branch de destino: $BASE_REF"

      - name: Ler branch editorial
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Carregar script de reescrita da branch main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          if ! git cat-file -e origin/main:refazer_materia.py; then
            echo "O arquivo refazer_materia.py nao foi encontrado na branch main."
            exit 1
          fi

          git show origin/main:refazer_materia.py \
            > refazer_materia.py

          if [ ! -s refazer_materia.py ]; then
            echo "O arquivo refazer_materia.py foi carregado vazio."
            exit 1
          fi

          python3 -m py_compile refazer_materia.py

          echo "Script refazer_materia.py carregado da branch main."

      - name: Registrar orientacao do editor
        shell: bash
        run: |
          set -euo pipefail

          jq -r '.comment.body' "$GITHUB_EVENT_PATH" \
            | sed '1s#^/refazer[[:space:]]*##' \
            > orientacao-refazer.txt

          if [ ! -s orientacao-refazer.txt ]; then
            echo "Use o comando seguido da orientacao editorial."
            echo ""
            echo "Exemplo:"
            echo "/refazer Compare o recurso com o que existe no Brasil."
            exit 1
          fi

          echo "Orientacao editorial recebida:"
          cat orientacao-refazer.txt

      - name: Instalar dependencias
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check groq

      - name: Refazer materia e imagem
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          python3 refazer_materia.py \
            --instruction-file orientacao-refazer.txt

      - name: Validar arquivos refeitos
        shell: bash
        run: |
          set -euo pipefail

          python3 -m py_compile refazer_materia.py

          python3 - <<'PY'
          import json
          from pathlib import Path

          arquivo = Path("noticias.json")

          if not arquivo.is_file():
              raise SystemExit(
                  "ERRO: noticias.json nao foi encontrado."
              )

          dados = json.loads(
              arquivo.read_text(encoding="utf-8")
          )

          if not isinstance(dados, list):
              raise SystemExit(
                  "ERRO: noticias.json deve conter uma lista."
              )

          if not dados:
              raise SystemExit(
                  "ERRO: noticias.json ficou vazio."
              )

          resumo = Path("resumo-refazer.md")

          if not resumo.is_file() or not resumo.stat().st_size:
              raise SystemExit(
                  "ERRO: resumo-refazer.md nao foi criado."
              )

          obrigatorios = (
              "titulo",
              "resumo",
              "categoria_sugerida",
              "data",
              "fonte",
              "link",
          )

          for numero, item in enumerate(dados, start=1):
              if not isinstance(item, dict):
                  raise SystemExit(
                      f"ERRO: item {numero} invalido."
                  )

              for campo in obrigatorios:
                  valor = item.get(campo)

                  if not isinstance(valor, str) or not valor.strip():
                      raise SystemExit(
                          f"ERRO: item {numero} sem {campo}."
                      )

          print(
              "Validacao concluida:",
              len(dados),
              "item(ns)."
          )
          PY

      - name: Salvar nova versao na branch do Pull Request
        id: commit
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "motorhome-em-pauta-bot"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias.json resumo-refazer.md

          if [ -d "imagens/noticias" ]; then
            git add imagens/noticias
          fi

          if git diff --cached --quiet; then
            echo "alterou=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteracao nova foi produzida."
            exit 0
          fi

          git commit \
            -m "Refazer materia conforme orientacao editorial"

          git push origin "HEAD:$HEAD_REF"

          echo "alterou=true" >> "$GITHUB_OUTPUT"
          echo "Nova versao enviada para a branch $HEAD_REF."

      - name: Comentar resultado no Pull Request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          ALTEROU: ${{ steps.commit.outputs.alterou }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$ALTEROU" = "true" ] \
            && [ -f "resumo-refazer.md" ]; then

            {
              cat resumo-refazer.md
              echo
              echo "Os arquivos foram atualizados."
              echo
              echo "Revise novamente na aba **Files changed**."
              echo
              echo "A materia ainda nao foi publicada."
              echo "A publicacao ocorre somente depois do merge."
            } > comentario.md

          else

            {
              echo "Nao foi possivel produzir uma nova versao valida."
              echo
              echo "Consulte a execucao **Refazer materia por comentario** na aba Actions."
              echo
              echo "Nenhuma alteracao foi publicada na branch main."
            } > comentario.md

          fi

          gh pr comment \
            "$PR_NUMBER" \
            --body-file comentario.md

      - name: Guardar revisao como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revisao-refeita-pr-${{ github.event.issue.number }}
          path: |
            orientacao-refazer.txt
            resumo-refazer.md
            noticias.json
            imagens/noticias/
          if-no-files-found: warn
          retention-days: 7
