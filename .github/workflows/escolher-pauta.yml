name: Aprovar pauta e gerar reportagem completa

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: escolher-pauta-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  escolher-e-gerar:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/escolher') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Ler codigo da branch main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check groq beautifulsoup4

      - name: Validar Pull Request e comando
        id: contexto
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$COMMENT_BODY" =~ ^/escolher[[:space:]]+([1-5])[[:space:]]*$ ]]; then
            echo "ERRO: use somente /escolher N, com N entre 1 e 5."
            exit 1
          fi

          OPCAO="${BASH_REMATCH[1]}"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > /tmp/pr.json

          HEAD_SHA="$(jq -r '.head.sha' /tmp/pr.json)"
          HEAD_REF="$(jq -r '.head.ref' /tmp/pr.json)"
          BASE_REF="$(jq -r '.base.ref' /tmp/pr.json)"
          HEAD_REPO="$(jq -r '.head.repo.full_name' /tmp/pr.json)"

          if [ "$BASE_REF" != "main" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "ERRO: Pull Request de seleção inválido."
            exit 1
          fi

          ROTULOS="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name')"
          if ! grep -qx "selecao-de-pauta" <<< "$ROTULOS"; then
            echo "ERRO: este Pull Request não possui o rótulo selecao-de-pauta."
            exit 1
          fi

          echo "opcao=$OPCAO" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Reagir ao comando recebido
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        shell: bash
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
            -H "Accept: application/vnd.github+json" \
            -f content='eyes'

      - name: Baixar cinco pautas do Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.contexto.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            "repos/$GITHUB_REPOSITORY/contents/pautas-selecionadas.json?ref=$HEAD_SHA" \
            --jq '.content' \
            | tr -d '\n' \
            | base64 --decode \
            > pautas-selecionadas.json
          test -s pautas-selecionadas.json
          python3 -m json.tool pautas-selecionadas.json > /dev/null

      - name: Selecionar pauta aprovada
        env:
          OPCAO: ${{ steps.contexto.outputs.opcao }}
        shell: bash
        run: |
          set -euo pipefail
          python3 escolher_pauta.py \
            --input pautas-selecionadas.json \
            --option "$OPCAO" \
            --output pauta-escolhida.json \
            --summary resumo-pauta-escolhida.md

      - name: Gerar reportagem completa e imagem
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 gerar_materia_escolhida.py \
            --input pauta-escolhida.json \
            --news noticias.json \
            --summary resumo-aprovacao.md

      - name: Validar reportagem completa
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool noticias.json > /dev/null
          python3 validar_materias.py noticias.json

      - name: Preparar branch editorial
        id: branch
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          OPCAO: ${{ steps.contexto.outputs.opcao }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="aprovacao/materia-pr${PR_NUMBER}-opcao${OPCAO}"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

          cp pauta-escolhida.json /tmp/pauta-escolhida.json
          cp resumo-pauta-escolhida.md /tmp/resumo-pauta-escolhida.md
          cp resumo-aprovacao.md /tmp/resumo-aprovacao.md
          cp noticias.json /tmp/noticias.json
          cp resultado-geracao-materia.txt /tmp/resultado-geracao-materia.txt
          mkdir -p /tmp/imagens-noticias
          if [ -d imagens/noticias ]; then
            cp -a imagens/noticias/. /tmp/imagens-noticias/ || true
          fi

          git fetch origin main
          git switch --force-create "$BRANCH" origin/main

          cp /tmp/pauta-escolhida.json pauta-escolhida.json
          cp /tmp/resumo-pauta-escolhida.md resumo-pauta-escolhida.md
          cp /tmp/resumo-aprovacao.md resumo-aprovacao.md
          cp /tmp/noticias.json noticias.json
          cp /tmp/resultado-geracao-materia.txt resultado-geracao-materia.txt
          mkdir -p imagens/noticias
          cp -a /tmp/imagens-noticias/. imagens/noticias/ || true

          git config user.name "motorhome-em-pauta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pauta-escolhida.json resumo-pauta-escolhida.md resumo-aprovacao.md noticias.json resultado-geracao-materia.txt imagens/noticias

          if git diff --cached --quiet; then
            echo "ERRO: nenhuma alteração editorial foi produzida."
            exit 1
          fi

          git commit -m "Gerar reportagem completa da pauta ${OPCAO}"
          git push --force-with-lease origin "HEAD:$BRANCH"

      - name: Criar ou localizar Pull Request editorial
        id: pr_editorial
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          OPCAO: ${{ steps.contexto.outputs.opcao }}
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gh pr list --head "$BRANCH" --base main --state open --json url --jq '.[0].url // empty')"
          if [ -z "$URL" ]; then
            URL="$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Reportagem completa da pauta ${OPCAO}" \
              --body-file resumo-aprovacao.md)"
          fi
          gh pr edit "$URL" --add-label editorial --add-label aguardando-aprovacao || true
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Confirmar escolha no Pull Request original
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          OPCAO: ${{ steps.contexto.outputs.opcao }}
          PR_URL: ${{ steps.pr_editorial.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
            -H "Accept: application/vnd.github+json" \
            -f content='+1' || true

          cat > /tmp/comentario.md <<EOF
          ✅ Opção ${OPCAO} reconhecida e transformada em reportagem completa.

          A reportagem, a imagem e a validação editorial estão neste Pull Request:
          ${PR_URL}

          Revise o novo Pull Request. Use \`/refazer sua orientação\` para ajustes ou faça o merge para publicar.

          Este Pull Request de seleção não deve ser mesclado.
          EOF

          gh pr comment "$PR_NUMBER" --body-file /tmp/comentario.md

      - name: Guardar comprovantes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: producao-editorial-pr-${{ github.event.issue.number }}-opcao-${{ steps.contexto.outputs.opcao }}
          path: |
            pautas-selecionadas.json
            pauta-escolhida.json
            resumo-pauta-escolhida.md
            resumo-aprovacao.md
            resultado-geracao-materia.txt
            noticias.json
            imagens/noticias/
          if-no-files-found: ignore
          retention-days: 7
