name: Validar publicacao aprovada

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - noticias.json
      - imagens/noticias/**
      - qualidade_editorial.py
      - validar_materias.py
  push:
    branches: [main]
    paths:
      - noticias.json
      - imagens/noticias/**

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ler arquivos
        uses: actions/checkout@v6

      - name: Validar JSON
        run: python3 -m json.tool noticias.json > /dev/null

      - name: Validar qualidade editorial completa
        run: python3 validar_materias.py noticias.json
