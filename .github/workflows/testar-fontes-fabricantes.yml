name: Testar fontes dos fabricantes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Ler arquivos do repositorio
        uses: actions/checkout@v6

      - name: Verificar feeds sem publicar
        run: python3 testar_fontes_fabricantes.py

      - name: Guardar resultado
        uses: actions/upload-artifact@v4
        with:
          name: fontes-fabricantes
          path: fontes-fabricantes.json
          if-no-files-found: ignore
          retention-days: 7
