name: Radar editorial e aprovação
on:
  workflow_dispatch:
  schedule:
    - cron: "30 11,16,21 * * *"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: motorhome-aprovacao-editorial
  cancel-in-progress: false
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Instalar dependências
        run: python3 -m pip install groq requests
      - name: Descobrir pautas em alta
        run: python3 descobrir_tendencias.py
      - name: Coletar fontes nacionais
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 coletor.py | tee resultado-coletor.txt
      - name: Coletar e redigir fontes internacionais
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 coletar_internacionais.py | tee resultado-internacionais.txt
      - name: Selecionar pauta e gerar imagem
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 processar_publicacoes.py
      - name: Preparar alteração para revisão
        run: python3 preparar_publicacao.py
      - name: Verificar se há matéria
        id: materia
        run: |
          python3 - <<'PY'
          import json, pathlib, os
          p=pathlib.Path('pendentes-conferencia.json')
          ok=p.exists() and isinstance(json.loads(p.read_text(encoding='utf-8')),list) and len(json.loads(p.read_text(encoding='utf-8')))>0
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'tem_materia={str(ok).lower()}\n')
          PY
      - name: Criar ou atualizar Pull Request de aprovação
        if: steps.materia.outputs.tem_materia == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: aprovacao/editorial
          delete-branch: true
          commit-message: "Preparar matéria para aprovação editorial"
          title: "Aprovação editorial | Motorhome em Pauta"
          body-path: resumo-aprovacao.md
          labels: aprovação-editorial
          add-paths: |
            noticias.json
            imagens/noticias/**
            resumo-aprovacao.md
      - name: Preparar e-mail de aprovação
        if: steps.pr.outputs.pull-request-url != ''
        run: |
          cat resumo-aprovacao.md > email-aprovacao.txt
          printf '\n\nRevisar no GitHub: %s\n' '${{ steps.pr.outputs.pull-request-url }}' >> email-aprovacao.txt
      - name: Enviar e-mail de aprovação
        if: steps.pr.outputs.pull-request-url != ''
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Motorhome em Pauta | Matéria aguardando sua aprovação"
          to: "emerson.venarusso@dxc.com,emerson.venarusso@gmail.com"
          from: "Motorhome em Pauta <${{ secrets.MAIL_USERNAME }}>"
          body: file://email-aprovacao.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revisao-editorial
          path: |
            resultado-*.txt
            pautas-descobertas.json
            rascunhos-coletor.json
            pendentes-conferencia.json
            resumo-aprovacao.md
          if-no-files-found: ignore
          retention-days: 7
