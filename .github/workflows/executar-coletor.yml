name: Executar coletor em teste

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Ler arquivos do repositorio
        uses: actions/checkout@v6

      - name: Instalar biblioteca do Gemini
        run: python3 -m pip install google-genai

      - name: Executar coletor sem publicar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          python3 coletor.py | tee resultado-coletor.txt

      - name: Guardar resultado para conferencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-coletor
          path: resultado-coletor.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Guardar rascunhos sem publicar
        uses: actions/upload-artifact@v4
        with:
          name: rascunhos-coletor
          path: rascunhos-coletor.json
          if-no-files-found: ignore
          retention-days: 7
