name: Executar coletor em teste

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Ler arquivos do repositorio
        uses: actions/checkout@v6

      - name: Instalar biblioteca do Gemini
        run: python3 -m pip install google-genai

      - name: Executar coletor sem publicar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 coletor.py
