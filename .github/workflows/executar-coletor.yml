name: Coletar, redigir, criar imagem e publicar
on:
  workflow_dispatch:
    inputs:
      publicar_automaticamente:
        description: "Publicar apos as validacoes"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: motorhome-em-pauta-publicacao
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - run: python3 -m pip install groq requests
      - name: Coletar fontes nacionais
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 coletor.py | tee resultado-coletor.txt
      - name: Coletar e redigir fontes internacionais
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 coletar_internacionais.py | tee resultado-internacionais.txt
      - name: Escolher melhor item e gerar imagem
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 processar_publicacoes.py
      - name: Publicar
        if: ${{ inputs.publicar_automaticamente }}
        run: python3 publicar_pendentes.py

      - name: Validar materia antes do commit
        if: ${{ inputs.publicar_automaticamente }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool noticias.json > /dev/null
          python3 validar_materias.py noticias.json
      - name: Commit e push
        id: commit
        if: ${{ inputs.publicar_automaticamente }}
        run: |
          if git diff --quiet -- noticias.json imagens/noticias; then echo "publicou=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "motorhome-em-pauta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json imagens/noticias
          git commit -m "Publicar melhor noticia e imagem automaticamente"
          git push origin HEAD:main
          echo "publicou=true" >> "$GITHUB_OUTPUT"
      - name: Preparar email
        if: ${{ steps.commit.outputs.publicou == 'true' }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('pendentes-conferencia.json').read_text(encoding='utf-8'))[0]
          Path('email-publicacao.txt').write_text(f"Nova publicação no Motorhome em Pauta\n\nTítulo: {x['titulo']}\nCategoria: {x['categoria_sugerida']}\nFonte: {x['fonte']}\nResumo: {x['resumo']}\nLink: {x['link']}\nPontuação: {x.get('pontuacao_editorial','')}\n",encoding='utf-8')
          PY
      - name: Enviar email
        if: ${{ steps.commit.outputs.publicou == 'true' }}
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Motorhome em Pauta | Nova publicação"
          to: "emerson.venarusso@dxc.com,emerson.venarusso@gmail.com"
          from: "Motorhome em Pauta <${{ secrets.MAIL_USERNAME }}>"
          body: file://email-publicacao.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-publicacao
          path: |
            resultado-*.txt
            rascunhos-coletor.json
            pendentes-conferencia.json
          if-no-files-found: ignore
          retention-days: 7
