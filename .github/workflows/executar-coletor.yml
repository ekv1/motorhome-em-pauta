name: Coletar e publicar noticias

on:
  workflow_dispatch:
    inputs:
      publicar_automaticamente:
        description: "Publicar no site apos as validacoes"
        type: boolean
        required: false
        default: false
      gerar_previa_internacional:
        description: "Gerar previa internacional para conferencia"
        type: boolean
        required: false
        default: false
  schedule:
    # 08:30, 13:30 e 18:30 no horario de Brasilia (UTC-3).
    # O GitHub Actions interpreta o cron em UTC.
    - cron: "30 11,16,21 * * *"

permissions:
  contents: write

concurrency:
  group: motorhome-em-pauta-publicacao
  cancel-in-progress: false

jobs:
  coletar-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Ler arquivos do repositorio
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Instalar biblioteca do Groq
        run: python3 -m pip install groq

      - name: Executar coletor
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -o pipefail
          python3 coletor.py | tee resultado-coletor.txt

      - name: Validar rascunhos antes da publicacao
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          arquivo = Path("rascunhos-coletor.json")
          if not arquivo.exists():
              print("Nenhum rascunho gerado; nada a validar.")
              raise SystemExit(0)

          publicados = json.loads(Path("noticias.json").read_text(encoding="utf-8"))
          rascunhos = json.loads(arquivo.read_text(encoding="utf-8"))
          if not isinstance(publicados, list) or not isinstance(rascunhos, list):
              raise SystemExit("ERRO: arquivos JSON devem conter listas.")

          links_publicados = {
              item["link"].strip().rstrip("/").casefold()
              for item in publicados
              if isinstance(item, dict) and isinstance(item.get("link"), str)
          }
          categorias = {
              "Últimas notícias",
              "Eventos e feiras",
              "Histórias e comunidade",
              "Guias e vida a bordo",
              "Novidades internacionais",
          }
          obrigatorios = ("titulo", "categoria_sugerida", "data", "resumo", "fonte", "link")
          vistos = set()
          pendentes = []

          for numero, item in enumerate(rascunhos, start=1):
              if not isinstance(item, dict):
                  raise SystemExit(f"ERRO: rascunho {numero} nao e objeto.")
              if any(not isinstance(item.get(c), str) or not item[c].strip() for c in obrigatorios):
                  raise SystemExit(f"ERRO: rascunho {numero} tem campo ausente.")
              link = item["link"].strip()
              url = urlparse(link)
              if url.scheme != "https" or not url.netloc:
                  raise SystemExit(f"ERRO: rascunho {numero} tem link invalido.")
              chave = link.rstrip("/").casefold()
              if chave in links_publicados or chave in vistos:
                  print("DUPLICADO:", item["titulo"])
                  continue
              if item["categoria_sugerida"] not in categorias:
                  print("CATEGORIA A REVISAR:", item["titulo"])
                  continue
              if item.get("revisar_lancamento"):
                  print("LANCAMENTO A REVISAR:", item["titulo"])
                  continue
              vistos.add(chave)
              pendentes.append(item)
              print("APROVADO PELAS REGRAS:", item["titulo"])

          if pendentes:
              Path("pendentes-conferencia.json").write_text(
                  json.dumps(pendentes, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          print("Pendentes aprovados:", len(pendentes))
          print("noticias.json ainda nao foi alterado.")
          PY

      - name: Publicar noticias aprovadas
        if: ${{ github.event_name == 'schedule' || inputs.publicar_automaticamente }}
        run: python3 publicar_pendentes.py

      - name: Salvar publicacao no repositorio
        if: ${{ github.event_name == 'schedule' || inputs.publicar_automaticamente }}
        run: |
          if git diff --quiet -- noticias.json; then
            echo "Nenhuma noticia nova para publicar."
            exit 0
          fi
          git config user.name "motorhome-em-pauta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          git commit -m "Publicar noticias coletadas automaticamente"
          git push origin HEAD:main

      - name: Gerar previa internacional sem publicar
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.gerar_previa_internacional }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          test -f internacionais.py
          python3 internacionais.py

      - name: Guardar resultado da coleta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-coletor
          path: resultado-coletor.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Guardar rascunhos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rascunhos-coletor
          path: rascunhos-coletor.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar pendentes validados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pendentes-conferencia
          path: pendentes-conferencia.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar resultado da publicacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-publicacao
          path: resultado-publicacao.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar previa internacional
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.gerar_previa_internacional }}
        uses: actions/upload-artifact@v4
        with:
          name: previa-internacional
          path: previa-internacional/
          if-no-files-found: ignore
          retention-days: 7
