name: Executar coletor em teste

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Ler arquivos do repositorio
        uses: actions/checkout@v6

      - name: Instalar biblioteca do Groq
        run: python3 -m pip install groq

      - name: Executar coletor sem publicar
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -o pipefail
          python3 coletor.py | tee resultado-coletor.txt

      - name: Comparar rascunhos com noticias publicadas
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          arquivo_rascunhos = Path("rascunhos-coletor.json")

          if not arquivo_rascunhos.exists():
              print("Nenhum rascunho gerado; nada a comparar.")
              raise SystemExit(0)

          publicados = json.loads(
              Path("noticias.json").read_text(encoding="utf-8")
          )
          rascunhos = json.loads(
              arquivo_rascunhos.read_text(encoding="utf-8")
          )

          if not isinstance(publicados, list):
              raise SystemExit("ERRO: noticias.json nao e uma lista.")

          if not isinstance(rascunhos, list):
              raise SystemExit("ERRO: rascunhos nao sao uma lista.")

          links_publicados = {
              item["link"]
              for item in publicados
              if isinstance(item, dict)
              and isinstance(item.get("link"), str)
          }

          campos = ("titulo", "data", "resumo", "fonte", "link")
          categorias_exibidas = (
              "Últimas notícias",
              "Histórias e comunidade",
          )

          vistos_nesta_execucao = set()
          pendentes = []
          duplicados = 0
          em_revisao = 0

          for numero, item in enumerate(rascunhos, start=1):
              if not isinstance(item, dict):
                  raise SystemExit(
                      f"ERRO: rascunho {numero} nao e um objeto."
                  )

              if any(
                  not isinstance(item.get(campo), str)
                  or not item[campo].strip()
                  for campo in campos
              ):
                  raise SystemExit(
                      f"ERRO: rascunho {numero} tem campo ausente."
                  )

              link = item["link"].strip()
              endereco = urlparse(link)

              if endereco.scheme != "https" or not endereco.netloc:
                  raise SystemExit(
                      f"ERRO: rascunho {numero} tem link invalido."
                  )

              if (
                  link in links_publicados
                  or link in vistos_nesta_execucao
              ):
                  duplicados += 1
                  print("DUPLICADO:", item["titulo"])
                  continue

              vistos_nesta_execucao.add(link)

              if (
                  item.get("categoria_sugerida")
                  not in categorias_exibidas
              ):
                  em_revisao += 1
                  print("CATEGORIA A REVISAR:", item["titulo"])
                  continue

              pendentes.append(item)
              print("PENDENTE DE CONFERENCIA:", item["titulo"])

          print("Rascunhos encontrados:", len(rascunhos))
          print("Duplicados:", duplicados)
          print("Categorias a revisar:", em_revisao)
          print("Pendentes de conferencia:", len(pendentes))

          if pendentes:
              Path("pendentes-conferencia.json").write_text(
                  json.dumps(
                      pendentes,
                      ensure_ascii=False,
                      indent=2,
                  ) + "\n",
                  encoding="utf-8",
              )

          print("noticias.json nao foi alterado.")
          PY

      - name: Guardar resultado para conferencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-coletor
          path: resultado-coletor.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Guardar rascunhos sem publicar
        uses: actions/upload-artifact@v4
        with:
          name: rascunhos-coletor
          path: rascunhos-coletor.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar pendentes para conferencia
        uses: actions/upload-artifact@v4
        with:
          name: pendentes-conferencia
          path: pendentes-conferencia.json
          if-no-files-found: ignore
          retention-days: 7
